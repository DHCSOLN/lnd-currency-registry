name: DHCSOLN Automated Registry Whitelist Optimizer

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  optimize_and_whitelist:
    runs-on: ubuntu-latest
    
    # Establish complete clearance permissions across targets
    permissions:
      contents: write
      statuses: write
      checks: write

    steps:
    - name: Checkout Source Infrastructure Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Set Up Production Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Execute Troubleshooting & Whitelist Pipeline Lifecycle
      run: |
        # Assert workflow orchestration boundaries
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        # Ingest latest state to resolve concurrency locks
        git pull origin main --rebase
        
        # Build registry infrastructure locally
        python manage_registry.py
        
        # Clear out file tracking blockages and enforce remote synchronization
        git add currency.json
        
        # Only commit and push if changes exist
        if ! git diff-index --quiet HEAD --; then
          git commit -m "chore(registry): automated update clearing & whitelisting infrastructure metrics"
          git push origin main
        else
          echo "Registry configuration is completely clean and matches synchronization guidelines."
        fi
