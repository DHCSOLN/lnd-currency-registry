name: DHCSOLN Automated Registry Whitelist Optimizer

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  optimize_and_whitelist:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Source Infrastructure Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Set Up Production Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Enterprise Automation Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install GitPython

    - name: Execute Troubleshooting & Whitelist Pipeline Lifecycle
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        python manage_registry.py
